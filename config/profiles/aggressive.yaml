# 共享规划/执行约束；geometry 和 px4 段仅由仿真入口加载。
planner:
  manager/max_vel: 2.0
  manager/max_acc: 2.0
  manager/planning_horizon: 6.0
  manager/adaptive_timing: true
  manager/cruise_target: true
  manager/route_cruise_ratio: 0.95
  manager/route_terminal_ratio: 0.95
  fsm/replan_interval: 0.4
  fsm/use_route_seed: true
  fsm/planning_budget: 0.18
  optimization/weight_route_guide: 250.0
  optimization/weight_start_jerk: 0.5
  optimization/weight_time: 10.0
  optimization/max_vel: 2.0
  optimization/max_acc: 2.0
  optimization/max_jer: 5.4
  optimization/constraint_points_perPiece: 7
execution:
  execution/max_vel: 2.2
  execution/max_acc: 2.2
  execution/max_jer: 6.0
  execution/yaw_max_acc: 0.0
geometry:
  tilt_degrees: 20.0
  margin: 0.05
px4:
  MPC_TILTMAX_AIR: 20.0
