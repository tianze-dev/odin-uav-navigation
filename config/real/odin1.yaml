# 未标定模板；测量机体参考点与传感器安装后再启用。
uav_state_adapter:
  ros__parameters:
    mode: real
    sensor: odin1
    odom_topic: /odin1/odometry_highfreq
    cloud_topic: /odin1/cloud_slam
    source_frame: odom
    source_child: odin1_base_link
    cloud_in_world: true
    body_filter_radius: 0.5
    calibrated: false
    require_cloud_for_odometry: true
    record_localization_faults: true
    odom_timeout: 0.25
    cloud_timeout: 0.5
    cloud_wait_timeout: 0.2
    world_quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    sensor_translation:
    - 0.0
    - 0.0
    - 0.0
    sensor_quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    odom_sensor_translation:
    - 0.0
    - 0.0
    - 0.0
    odom_sensor_quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    velocity_world: true
    cloud_frame: odom
