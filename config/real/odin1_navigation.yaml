# Native Odin bringup. Conservative envelope pending installation/field validation.
ego_planner_node:
  ros__parameters:
    manager/max_vel: 0.45
    manager/max_acc: 0.45
    manager/planning_horizon: 3.75
    optimization/max_vel: 0.45
    optimization/max_acc: 0.45
    optimization/max_jer: 1.35
    fsm/allow_unknown: false
    execution/max_vel: 0.5
    execution/max_acc: 0.5
    execution/max_jer: 1.5
    grid_map/virtual_ground: -1.0
    grid_map/virtual_ceil: 2.0
    grid_map/inflation_shape: box
    grid_map/resolution: 0.1
    # Visualization runs in the planner executor; keep it off the control budget.
    grid_map/visualization_rate: 2.0
    # Two cells per axis at the Odin-specific 0.10 m resolution.
    grid_map/obstacles_inflation: 0.2
    grid_map/body_above: 0.2
    grid_map/body_below: 0.2
traj_server:
  ros__parameters:
    execution/max_vel: 0.5
    execution/max_acc: 0.5
    execution/max_jer: 1.5
    execution/yaw_mode: follow
uav_px4_bridge:
  ros__parameters:
    publish_external_odometry: false
    offboard_entry: rc
    offboard_entry_timeout: 60.0
    require_landed_state: false
    minimum_takeover_height: 0.5
    require_external_position: true
