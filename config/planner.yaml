# Internal optimization margin below the 1 m/s, 1 m/s², 3 m/s³ execution envelope.
ego_planner_node:
  ros__parameters:
    manager/max_vel: 0.9
    manager/max_acc: 0.9
    manager/feasibility_tolerance: 0.05
    manager/polyTraj_piece_length: 0.5
    manager/planning_horizon: 5.0
    fsm/replan_interval: 1.0
    fsm/planning_budget: 0.18
    manager/use_multitopology_trajs: true
    grid_map/frame_id: odom
    grid_map/resolution: 0.15
    grid_map/local_update_range_x: 7.5
    grid_map/local_update_range_y: 7.5
    grid_map/local_update_range_z: 3.0
    grid_map/obstacles_inflation: 0.5
    grid_map/enable_virtual_wall: true
    grid_map/virtual_ceil: 5.0
    grid_map/virtual_ground: 0.0
    grid_map/fading_time: 0.0  # Clear obstacles only from new free-space rays.
    optimization/check_full_trajectory: true
    optimization/constraint_points_perPiece: 5
    optimization/weight_obstacle: 10000.0
    optimization/weight_obstacle_soft: 5000.0
    optimization/weight_feasibility: 10000.0
    optimization/weight_sqrvariance: 10000.0
    optimization/weight_time: 10.0
    optimization/obstacle_clearance: 0.1
    optimization/obstacle_clearance_soft: 0.3
    optimization/max_vel: 0.9
    optimization/max_acc: 0.9
    optimization/max_jer: 2.7
